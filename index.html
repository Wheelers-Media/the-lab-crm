<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The browser chrome takes the colour of the top of the page: ink in the
         dark theme, paper in the light one. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0A0A0B"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#FAFAFA"
    />
    <meta name="google" content="notranslate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="THE LAB" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="40x40" href="./appIcon/40.png" />
    <link rel="apple-touch-icon" sizes="58x58" href="./appIcon/58.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="./appIcon/60.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="./appIcon/76.png" />
    <link rel="apple-touch-icon" sizes="80x80" href="./appIcon/80.png" />
    <link rel="apple-touch-icon" sizes="87x87" href="./appIcon/87.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="./appIcon/114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="./appIcon/120.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="./appIcon/128.png" />
    <link rel="apple-touch-icon" sizes="136x136" href="./appIcon/136.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./appIcon/152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./appIcon/167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./appIcon/180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./appIcon/192.png" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="./appIcon/1024.png" />
    <title>THE LAB CRM</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background: #0a0a0b;
      }

      /* Prevent accidental double-tap zoom on interactive elements */
      button,
      input,
      select,
      textarea,
      a {
        touch-action: manipulation;
      }

      /* The boot screen: the shop's ink, the mark, and a hairline that fills
         while the app loads. It matches the app it becomes, so opening the
         CRM never flashes white first. */
      .loader-container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1.5rem;
        position: fixed;
        inset: 0;
        background-color: #0a0a0b;
        padding: env(safe-area-inset-top, 0px) 2rem
          env(safe-area-inset-bottom, 0px);
      }

      .loader-mark {
        font-family:
          ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        font-weight: 700;
        font-size: clamp(1.25rem, 6vw, 1.75rem);
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #f2f4f7;
        padding-left: 0.34em; /* balance the trailing tracking */
        opacity: 0;
        transform: translateY(4px);
        animation: lab-boot-in 480ms cubic-bezier(0.16, 1, 0.3, 1) 60ms forwards;
      }

      .loader-track {
        width: min(120px, 34vw);
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: #1b1c1f;
        opacity: 0;
        animation: lab-boot-in 480ms cubic-bezier(0.16, 1, 0.3, 1) 200ms
          forwards;
      }

      .loader-bar {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #0066ff;
        animation: lab-boot-slide 1.1s cubic-bezier(0.4, 0, 0.2, 1) 300ms
          infinite;
      }

      .loader-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* Shown by the boot watchdog below when the app is slow to open */
      .loader-help {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        max-width: 20rem;
        text-align: center;
        font-family:
          ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        color: #f2f4f7;
      }

      .loader-help p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.4;
      }

      .loader-help .loader-help-note {
        font-size: 0.75rem;
        color: #9aa0aa;
        word-break: break-word;
      }

      .loader-help-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      .loader-help button {
        min-width: 44px;
        min-height: 44px;
        padding: 0 1.25rem;
        border: 1px solid #2a2c31;
        border-radius: 0.5rem;
        background: #1b1c1f;
        color: #f2f4f7;
        font: inherit;
        font-size: 0.9375rem;
      }

      .loader-help button.loader-help-primary {
        border-color: #0066ff;
        background: #0066ff;
        color: #ffffff;
      }

      @keyframes lab-boot-in {
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes lab-boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-mark,
        .loader-track {
          opacity: 1;
          transform: none;
          animation: none;
        }
        .loader-bar {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader-container" role="status" aria-live="polite">
        <span class="loader-mark" aria-hidden="true">THE LAB</span>
        <div class="loader-track" aria-hidden="true">
          <div class="loader-bar"></div>
        </div>
        <span class="loader-label">Loading THE LAB CRM</span>
      </div>
    </div>
    <script>
      // The status bar follows the theme the app is actually showing, not only
      // the system setting: the class on <html> is the app's own choice.
      (function () {
        function apply() {
          var dark = document.documentElement.classList.contains("dark");
          var color = dark ? "#0A0A0B" : "#FAFAFA";
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          if (metas.length === 1 && metas[0].content === color) return;
          for (var i = 0; i < metas.length; i += 1) metas[i].remove();
          var meta = document.createElement("meta");
          meta.name = "theme-color";
          meta.content = color;
          document.head.appendChild(meta);
        }
        apply();
        new MutationObserver(apply).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["class"],
        });
      })();
    </script>
    <script id="boot-watchdog" data-after="15000">
      // If the boot screen is still up after a while, say so and offer a way
      // out: reload, or reset the saved copy of the app on this phone (its
      // service worker and caches; the sign-in stays). It lives in the page
      // itself so it still works when the app's own code never starts, and it
      // shows what went wrong so a stuck phone can be diagnosed.
      (function () {
        var after =
          Number(
            document.currentScript &&
              document.currentScript.getAttribute("data-after"),
          ) || 15000;
        var notes = [];
        function note(reason) {
          var text = reason && reason.message ? reason.message : String(reason);
          if (notes.length < 3 && notes.indexOf(text) < 0) {
            notes.push(text.slice(0, 140));
          }
        }
        window.addEventListener("error", function (event) {
          note(event.message || "Script error");
        });
        window.addEventListener("unhandledrejection", function (event) {
          note(event.reason);
        });

        function reset() {
          var jobs = [];
          if (
            navigator.serviceWorker &&
            navigator.serviceWorker.getRegistrations
          ) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (all) {
                return Promise.all(
                  all.map(function (registration) {
                    return registration.unregister();
                  }),
                );
              }),
            );
          }
          if (window.caches && window.caches.keys) {
            jobs.push(
              window.caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (key) {
                    return window.caches.delete(key);
                  }),
                );
              }),
            );
          }
          Promise.all(jobs)
            .catch(function () {})
            .then(function () {
              try {
                sessionStorage.removeItem("chunk-reload");
                localStorage.removeItem("REACT_QUERY_OFFLINE_CACHE");
              } catch (error) {}
              window.location.reload();
            });
        }

        function add(parent, tag, text, className) {
          var element = document.createElement(tag);
          element.textContent = text;
          if (className) element.className = className;
          parent.appendChild(element);
          return element;
        }

        function isBlank(root) {
          return !root || !root.textContent.trim();
        }

        setTimeout(function () {
          var root = document.getElementById("root");
          var loader = document.querySelector(".loader-container");
          // Nothing on screen: the boot screen is still up, or the app took
          // it down and has drawn nothing yet (a request that never answers)
          if (!loader && !isBlank(root)) return;
          var started =
            document.documentElement.getAttribute("data-boot") === "started";
          if (!loader) {
            loader = document.createElement("div");
            loader.className = "loader-container";
            loader.setAttribute("role", "status");
            document.body.appendChild(loader);
            // The app draws into #root: once it has, this cover is not needed
            new MutationObserver(function (changes, observer) {
              if (isBlank(root)) return;
              observer.disconnect();
              loader.remove();
            }).observe(root, {
              childList: true,
              subtree: true,
              characterData: true,
            });
          }
          var track = loader.querySelector(".loader-track");
          if (track) track.hidden = true;

          var help = document.createElement("div");
          help.className = "loader-help";
          add(
            help,
            "p",
            started
              ? "THE LAB is taking longer than usual to open."
              : "THE LAB could not start on this phone.",
          );
          notes.forEach(function (text) {
            add(help, "p", text, "loader-help-note");
          });
          var actions = document.createElement("div");
          actions.className = "loader-help-actions";
          add(actions, "button", "Reload", "loader-help-primary").onclick =
            function () {
              window.location.reload();
            };
          add(actions, "button", "Reset the app").onclick = reset;
          help.appendChild(actions);
          add(
            help,
            "p",
            "Reset clears the app's saved copy and saved data on this phone. You stay signed in.",
            "loader-help-note",
          );
          loader.appendChild(help);
        }, after);
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="<%= mainScript %>"></script>
  </body>
</html>
