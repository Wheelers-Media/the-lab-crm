name: Deploy database and functions

# Applies database migrations and deploys the edge functions to THE LAB's
# Supabase project. The front end is built and hosted by Vercel separately.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created

on:
    push:
        branches:
            - main
        paths:
            - "supabase/**"
            - ".github/workflows/supabase.yml"
    workflow_dispatch:

concurrency:
    group: supabase-deploy
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to Supabase
        runs-on: ubuntu-latest
        timeout-minutes: 15

        env:
            SUPABASE_PROJECT_ID: mxoqwwdpclfkoydfofug
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        steps:
            - name: Check secrets
              if: ${{ !env.SUPABASE_ACCESS_TOKEN || !env.SUPABASE_DB_PASSWORD }}
              run: |
                  echo "::error::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets, then re-run this workflow."
                  exit 1

            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Supabase CLI
              uses: supabase/setup-cli@v1
              with:
                  version: latest

            - name: Link project
              run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

            - name: Apply database migrations
              run: supabase db push

            - name: Deploy edge functions
              run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
