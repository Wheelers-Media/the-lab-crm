name: Admin reset link

# One-off: encrypted password reset link for the owner (no email sent).
on:
    push:
        branches:
            - "admin/**"
        paths:
            - "admin/link.mjs"
            - "admin/link_public.pem"

permissions:
    contents: write

jobs:
    link:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            SUPABASE_PROJECT_ID: mxoqwwdpclfkoydfofug
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Make link
              run: |
                  set +e
                  node admin/link.mjs > admin/link_result.txt 2>&1
                  echo "exit: $?" >> admin/link_result.txt
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add admin/link_result.txt admin/link.enc 2>/dev/null
                  git commit -m "Admin link result"
                  git push
